[package]
name = "fbtree"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["preadpwrite_sync"]
log_trace = []
log_debug = []
log_info = []
log_warn = []
log_error = []
stat = []
timer = []

# Page sizes. If page sizes are larger than 256k, pages will be heap allocated to avoid stack overflow.
# Default is 16KB (defined in page.rs)
4k_page = []
8k_page = []
16k_page = []
32k_page = []
64k_page = []
128k_page = []
256k_page = ["heap_allocated_page"]
512k_page = ["heap_allocated_page"]
1m_page = ["heap_allocated_page"]
heap_allocated_page = []

# Hints
no_tree_hint = []
no_bp_hint = []

# BP type
bp_overflow = []  # overflow_bp module: custom chaining HT (OverflowTable) + clock
bp_open_addressing = ["no_bp_hint"] # open_addressing_bp: frame array IS the hash table, linear probing
bp_clock = []
bp_predicache = ["no_bp_hint"]
bp_pt2 = ["no_bp_hint"]       # predictive_translation_two module: PT with two hash predictions
bp_lapt = ["no_bp_hint"] # LAPT: PT-FP-V2 + congee/ART overflow + ophash
bp_pt2_bucket = ["no_bp_hint"] # PT variant: two hashes + metadata verify-and-fast-return
bp_pt4_bucket = ["no_bp_hint"] # PT variant: four hashes + metadata verify-and-fast-return
bp_pt_tlb = ["no_bp_hint"]    # PT variant: per-thread L1-resident translation cache
bp_pt_tlb_only = ["no_bp_hint"] # TLB + overflow only (no preferred frame check)
bp_pt_tlb_only_keys = ["no_bp_hint"] # Experimental TLB + overflow only with separate key array
bp_tlb = ["no_bp_hint"] # Standalone TLB BP with unified hash (no PT dependency)
tlb_victim_cache = [] # Use direct-mapped + 16-entry victim cache instead of 4-way
tlb_prefetch = [] # Prefetch neighbor page data during range prefill
pt_counts = []    # Lightweight PT hit/fallback counters without timing detail
pt_profile = ["bp_predicache"]  # Enables sub-step timing within PT page accesses
pt_no_prefetch = []     # Disable PT speculative prefetch for comparison runs
bp_macro_profile = []   # Coarse BP method timing for create/read/write paths
vmcache = ["no_bp_hint"] # vmcache does not need a bp hint

# Old iterator for foster btree
old_iter = []
preadpwrite_sync = [] # synchronous I/O implementation using pread/pwrite. Default
iouring_sync = [] # synchronous I/O implementation using io-uring
iouring_async = [] # asynchronous I/O implementation using io-uring

# Event tracer
event_tracer = ["duckdb"]

[dependencies]
rayon = "1.10.0"
tempfile = "3.16.0"
rand = {version = "0.9.0", features = ["small_rng"]}
getrandom = { version = "0.3.1", features = ["wasm_js"] }
serde = { version = "1.0.217", features = ["derive"] }
chrono = "0.4.39"
lazy_static = { version = "1.4" }
clap = {version = "4.5.27", features = ["derive"]}
concurrent-queue = "2.5"
io-uring = {version = "0.7.4"}
libc = {version = "0.2.169"}
memchr = "2.7.4"
crossbeam-epoch = "0.9"
congee = { git = "https://github.com/rotaki/congee.git", branch = "main" }
dashmap = "6.1"
arc-swap = "1.7"
criterion = { version = "0.5", features = ["html_reports"]}
hdrhistogram = "7.5.4"
# mimalloc = "0.1.46"
duckdb = { version = "1.2.2", features = ["bundled"], optional = true }

[dev-dependencies]
serde_cbor = "0.11"
rstest = "0.24.0"

# For wasm (uncomment to use)
# [lib]
# crate-type = ["cdylib", "rlib"]
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
# debug = true # For perf

[[bench]]
name = "foster_btree_insert"
harness = false

[[bench]]
name = "foster_btree_page_ops"
harness = false

[[bench]]
name = "hash_index_insert"
harness = false

[[bench]]
name = "congee_vs_opm_bench"
harness = false
